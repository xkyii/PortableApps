; FlyingBird Portable - launcher configuration
; Redirects the app's %APPDATA% and %LOCALAPPDATA% data dirs into the
; portable Data directory so config, profiles and caches travel with the app.

[Launch]
ProgramExecutable=AppFile\FlyingBird.exe
DirectoryMoveOK=yes
SupportsUNC=yes
WorkingDirectory=%PAL:AppDir%\AppFile

[CloseEXE]
; FlyingBird.exe spawns FlyingBirdCore.exe (the proxy engine) and, when TUN /
; helper features are used, FlyingBirdHelperService.exe. They may outlive the
; GUI window, so force-close them on exit to release file locks before PAL
; moves the data dirs back into Data. (If the helper runs as a real system
; service it won't be a child process and this just won't match anything.)
EXE1=FlyingBirdCore.exe
EXE2=FlyingBirdHelperService.exe

[DirectoriesMove]
; Both dirs on disk are literally named FlyingBird\FlyingBird under different
; roots, so give them UNIQUE left keys to create distinct Data subdirs and
; avoid the same-name collision PAL would otherwise hit.
FlyingBirdRoaming=%APPDATA%\FlyingBird\FlyingBird
FlyingBirdLocal=%LOCALAPPDATA%\FlyingBird\FlyingBird

