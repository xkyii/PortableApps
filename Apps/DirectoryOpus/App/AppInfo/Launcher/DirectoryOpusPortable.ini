; Directory Opus Portable - launcher configuration
; Redirects DOpus per-machine data directories and its HKCU registry branch
; into the portable Data directory so configuration (and the licence
; certificate dopus.cert) travels with the app.

[Launch]
ProgramExecutable=AppFile\dopus.exe
DirectoryMoveOK=yes
SupportsUNC=yes
; DOpus keeps its dopusd.exe daemon alive after the main window closes, which
; locks files under the GPSoftware data dirs. Kill it once DOpus has fully
; exited so PAL can move the directories back into Data.
RunAfter1="%WINDIR%\System32\taskkill.exe" /F /IM dopusd.exe

[RegistryKeys]
; Whole HKCU\Software\GPSoftware branch (user prefs + residual state)
GPSoftware=HKCU\Software\GPSoftware

[DirectoriesMove]
; Move the three GPSoftware data dirs to/from Data on launch/exit.
; Each MUST have a UNIQUE name on the left (Data subdirectory) because all
; three are called "GPSoftware" on disk - PAL would otherwise collide them.
; %ALLUSERSAPPDATA% is the PAL variable for %PROGRAMDATA% (C:\ProgramData).
AppDataGPSoftware=%APPDATA%\GPSoftware
LocalAppDataGPSoftware=%LOCALAPPDATA%\GPSoftware
ProgramDataGPSoftware=%ALLUSERSAPPDATA%\GPSoftware
