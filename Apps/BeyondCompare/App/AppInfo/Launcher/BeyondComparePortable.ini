; Beyond Compare Portable - launcher configuration
;
; Registration: Beyond Compare reads BC5Key.txt from the folder holding
; BCompare.exe, so the key file travels inside App\AppFile (and App\AppFile32)
; and no re-registration is needed on a new machine - same pattern as the
; DOpus dopus.opuscert certificate.
;
; Settings: the per-user settings directory %APPDATA%\Scooter Software is
; redirected into Data so preferences travel with the app, together with the
; HKCU\Software\Scooter Software branch (CacheID, SupportsMerge, ...).
;
; NOTE: RunAsAdmin is intentionally NOT set. The upstream package used
; "RunAsAdmin=force" only so Beyond Compare could install its Explorer shell
; extension (BCShellEx, which needs HKLM). Leaving it out keeps launching
; UAC-free, which is the point of a portable app; the cost is that the Explorer
; right-click menu integration is not registered. Re-add the line if wanted.

[Launch]
; 32-bit build on 32-bit Windows, 64-bit build on 64-bit Windows
ProgramExecutable=AppFile32\BCompare.exe
ProgramExecutable64=AppFile\BCompare.exe
DirectoryMoveOK=yes
SupportsUNC=yes

[RegistryKeys]
ScooterSoftware=HKCU\Software\Scooter Software

[DirectoriesMove]
; Left-hand name is the directory under Data\ that holds the moved data.
AppDataScooterSoftware=%APPDATA%\Scooter Software

[DirectoriesCleanupIfEmpty]
1=%APPDATA%\Scooter Software
